# =============================================================================
#  Optional: XAMPP Apache reverse-proxy configuration for Aapat Setu
# =============================================================================
# This lets you access the app via:  http://localhost/aapatsetu     (port 80)
# instead of                         http://localhost:8000
#
# INSTRUCTIONS:
#
#  1. Make sure these Apache modules are enabled in XAMPP:
#     Open  XAMPP Control Panel → Apache → Config → httpd.conf
#     Ensure these lines are UNCOMMENTED (no # in front):
#        LoadModule proxy_module         modules/mod_proxy.so
#        LoadModule proxy_http_module    modules/mod_proxy_http.so
#        LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
#     Then restart Apache.
#
#  2. Open  XAMPP Control Panel → Apache → Config → "httpd-vhosts.conf"
#     (or edit xampp/apache/conf/extra/httpd-vhosts.conf manually),
#     and APPEND the contents below at the end of the file.
#
#  3. Make sure the FastAPI backend is running on port 8000 (run ./run_xampp.sh).
#
#  4. Restart Apache from the XAMPP Control Panel.
#
#  5. Open  http://localhost/aapatsetu/  in your browser.
# =============================================================================

# WebSocket (for real-time incident/alerts updates)
ProxyPass /aapatsetu/ws  ws://127.0.0.1:8000/ws
ProxyPassReverse /aapatsetu/ws  ws://127.0.0.1:8000/ws

# REST API
ProxyPass /api http://127.0.0.1:8000/api
ProxyPassReverse /api http://127.0.0.1:8000/api

# Static assets + SPA
ProxyPass /assets http://127.0.0.1:8000/assets
ProxyPassReverse /assets http://127.0.0.1:8000/assets

ProxyPass /aapatsetu http://127.0.0.1:8000
ProxyPassReverse /aapatsetu http://127.0.0.1:8000

# SPA fallback (needed for React Router deep-links like /incidents/5)
<LocationMatch "^/aapatsetu/(?!api|assets|ws).*">
    ProxyPassMatch "!"
    RewriteEngine On
    RewriteRule ^/aapatsetu/(.*)$ http://127.0.0.1:8000/ [P,L]
</LocationMatch>
